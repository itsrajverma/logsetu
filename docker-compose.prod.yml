# Production variant: Postgres + persistent volumes.
#   docker compose -f docker-compose.prod.yml up -d
# Put secrets in a .env file next to this file (see .env.example).
services:
  logsetu:
    image: ghcr.io/itsrajverma/logsetu:latest
    restart: unless-stopped
    ports:
      - "${LOGSETU_PORT:-8686}:8686"
    environment:
      LOGSETU_ADMIN_PASSWORD: ${LOGSETU_ADMIN_PASSWORD:?set LOGSETU_ADMIN_PASSWORD in .env}
      LOGSETU_SECRET: ${LOGSETU_SECRET:?set LOGSETU_SECRET in .env (any long random string)}
      DATABASE_URL: postgresql://${POSTGRES_USER:-logsetu}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-logsetu}
      LOGSETU_DEFAULT_RETENTION_DAYS: ${LOGSETU_DEFAULT_RETENTION_DAYS:-}
      LOGSETU_PUBLIC_URL: ${LOGSETU_PUBLIC_URL:-}
      LOGSETU_SMTP_URL: ${LOGSETU_SMTP_URL:-}
      LOGSETU_SMTP_FROM: ${LOGSETU_SMTP_FROM:-}
      LOGSETU_RATE_LIMIT_PER_MIN: ${LOGSETU_RATE_LIMIT_PER_MIN:-5000}
      # Set to 1 when serving over HTTPS (behind a reverse proxy) so the session cookie is Secure.
      LOGSETU_SECURE_COOKIES: ${LOGSETU_SECURE_COOKIES:-0}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-logsetu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-logsetu}
    volumes:
      - logsetu-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-logsetu} -d ${POSTGRES_DB:-logsetu}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  logsetu-pgdata:
