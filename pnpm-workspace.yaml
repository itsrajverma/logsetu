packages:
  - "apps/*"
  - "packages/*"
  - "examples/*"

allowBuilds:
  better-sqlite3: true
  prisma: true
  "@prisma/client": true
  "@prisma/engines": true
  esbuild: true
  sharp: true

minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.11.2'
  - '@turbo/darwin-arm64@2.11.2'
  - '@turbo/linux-64@2.11.2'
  - '@turbo/linux-arm64@2.11.2'
  - '@turbo/windows-64@2.11.2'
  - '@turbo/windows-arm64@2.11.2'
  - turbo@2.11.2
