name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server-and-js:
    name: Server + logsetu-js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4  # version comes from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter logsetu-js build
      - run: pnpm --filter @logsetu/server prisma:generate
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm --filter @logsetu/server build

  django:
    name: logsetu-django
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12", "3.13"]
    defaults:
      run:
        working-directory: packages/logsetu-django
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m build && python -m twine check dist/*

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: logsetu:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
